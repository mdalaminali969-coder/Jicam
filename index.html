<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jicam AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131c;
  color: white;
}
header {
  padding: 18px;
  background: #191e2b;
  font-size: 23px;
  font-weight: bold;
  color: #8b9cff;
}
main {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}
.welcome {
  text-align: center;
  margin-top: 100px;
}
.welcome h1 { font-size: 32px; }
.welcome p { color: #aeb5c7; }
#chat {
  padding-bottom: 100px;
}
.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.user { background: #303b59; }
.ai { background: #202738; }
form {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  gap: 8px;
  padding: 15px;
  background: #191e2b;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #414b60;
  background: #252d40;
  color: white;
  font-size: 16px;
}
button {
  padding: 12px 18px;
  background: #687cff;
  color: white;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>
<body>
<header>✦ Jicam AI</header>
<main>
  <div class="welcome" id="welcome">
    <h1>স্বাগতম Jicam AI-তে</h1>
    <p>তোমার যেকোনো প্রশ্ন এখানে করো।</p>
  </div>
  <div id="chat"></div>
</main>
<form id="form">
  <input id="question" placeholder="এখানে প্রশ্ন লেখো..." required>
  <button type="submit">পাঠাও</button>
</form>
<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();
  const input = document.getElementById("question");
  const question = input.value.trim();
  if (!question) return;
  document.getElementById("welcome").style.display = "none";
  const msg = document.createElement("div");
  msg.className = "message user";
  msg.textContent = question;
  document.getElementById("chat").appendChild(msg);
  const reply = document.createElement("div");
  reply.className = "message ai";
  reply.textContent = "তোমার প্রশ্ন গ্রহণ করা হয়েছে। Gemini AI সংযোগ করার পর আমি উত্তর দিতে পারব।";
  document.getElementById("chat").appendChild(reply);
  input.value = "";
});
</script>
</body>
</html>
